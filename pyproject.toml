[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "manson-ashare"
version = "0.1.0"
description = "Point-in-time A-share research pipeline and static dashboard"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "httpx>=0.27,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7", "tenacity>=8,<10", "google-auth>=2.30,<3", "requests>=2.32,<3", "pyarrow>=17,<24", "pypdf>=6,<7"]
[project.optional-dependencies]
AI = ["openai>=1.60,<3"]
dev = ["pytest>=8,<10"]
[project.scripts]
manson = "src.cli:main"
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
