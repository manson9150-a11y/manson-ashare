          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          for name, item in files.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if actual not in (item['before'], item['sha256']):
                  raise RuntimeError('Concurrent source change: ' + name)
              assert hashlib.sha256(item['text'].encode()).hexdigest() == item['sha256']
          for name, item in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item['text'], encoding='utf-8')
          Path('.git/repair-paths.json').write_text(json.dumps(list(files)))
          print('Staged reviewed files:', len(files))
      - name: Install locked dependencies
        run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Run regression tests and complete offline cycle
        run: |
          pytest -q
          python -m src.cli --demo --stage full_pipeline --date 2026-09-04
          node --check dashboard/app.js
          git diff --check
      - name: Read-only live source verification
        run: python -m src.collectors.verify_candidate_evidence
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-pool-repair-verification
          path: |
            artifacts/candidate-evidence-verification/
            artifacts/demo/
          retention-days: 14
      - name: Commit tested repair and remove this one-time workflow
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          def git(*args): subprocess.run(['git', *args], check=True)
          paths = json.loads(Path('.git/repair-paths.json').read_text())
          git('config', 'user.name', 'manson-research[bot]')
          git('config', 'user.email', 'manson-research[bot]@users.noreply.github.com')
          git('restore', '--', 'dashboard/data/demo.json')
          git('add', '--', *paths)
          git('rm', '--', '.github/workflows/apply-candidate-repair.yml')
          git('commit', '-m', 'Fix empty limit-up and independent catalyst pools with verified evidence')
          git('pull', '--rebase', 'origin', 'main')
          git('push', 'origin', 'HEAD:main')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: repair
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

