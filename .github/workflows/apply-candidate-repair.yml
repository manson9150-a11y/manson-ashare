# One-time delivery of the reviewed A/C repair. Verifies every original file hash,
# tests the candidate tree, commits only the listed source files, then removes itself.
# Uses the repository's existing Actions/Pages permissions; no external secrets.
name: Apply and verify candidate pool repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-candidate-repair.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: manson-production-data
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
