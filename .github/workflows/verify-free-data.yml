name: Verify free daily data sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/collectors/**', 'src/verify_free_data.py', 'requirements.lock', '.github/workflows/verify-free-data.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m src.verify_free_data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-data-health
          path: artifacts/free_sources.json
          retention-days: 14
