name: Daily A-share Research
on:
  schedule:
    # Target start times in Asia/Shanghai: 08:00, 12:00, 22:00.
    # The application checks exchange holidays and actual observation cutoffs.
    - cron: '0 0 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      run_stage:
        description: '研究阶段；full_pipeline只执行当前合法时间窗，避免未来数据泄漏'
        type: choice
        options: ['0800', '1200', '2200', full_pipeline]
        default: '2200'
concurrency:
  group: manson-production-data
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install tested dependencies
        run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Refresh timestamped sector metadata
        run: python -u -m src.maintenance
      - name: Run scheduled research
        env:
          TZ: Asia/Shanghai
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_STAGE: ${{ inputs.run_stage || '2200' }}
          WUDAO_API_KEY: ${{ secrets.WUDAO_API_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -u -m src.cli --stage "$RUN_STAGE" --schedule "$EVENT_SCHEDULE"
      - name: Preserve derived data, outbox and reports
        if: always()
        run: |
          git config user.name 'manson-research[bot]'
          git config user.email 'manson-research[bot]@users.noreply.github.com'
          mkdir -p data/cache
          git add data/cache data/bootstrap data/history data/latest data/pending reports dashboard/data/latest.json dashboard/data/run_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist scheduled research [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_id }}
          path: |
            data/
            reports/
          retention-days: 14
      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    if: always() && needs.research.result != 'cancelled'
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
